<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL DESCENSO — Ranking Global</title>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#c9c0b0;font-family:'Special Elite','Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-family:'Nosifer',cursive;font-size:min(48px,10vw);color:#b00;text-shadow:0 0 30px #f00,0 0 70px #500;margin-bottom:10px;text-align:center}
.sub{color:#977;font-style:italic;margin-bottom:30px;text-align:center}
.back{color:#a77;text-decoration:none;margin-bottom:30px;font-size:14px;letter-spacing:2px}
.back:hover{color:#d99;text-shadow:0 0 10px #500}
#ranking{width:100%;max-width:600px;margin-bottom:30px}
.rank-row{display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #311;font-size:18px}
.rank-row:first-child{background:#2a0000;color:#ffb3b3;box-shadow:inset 0 0 12px #500}
.rank-row:nth-child(2){background:#1a0a0a;color:#e8c8c8}
.rank-row:nth-child(3){background:#0d0505;color:#d4a8a8}
.rank-num{width:50px;color:#a33}
.rank-name{flex:1;text-align:left;padding:0 20px}
.rank-time{color:#e33;font-weight:bold}
#pagination{display:flex;gap:10px;align-items:center}
#pagination button{background:#1a0000;color:#e33;border:2px solid #700;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:14px;letter-spacing:2px}
#pagination button:hover:not(:disabled){background:#400;color:#fff;box-shadow:0 0 20px #a00}
#pagination button:disabled{opacity:0.3;cursor:not-allowed}
#pageInfo{color:#977;font-size:14px;min-width:120px;text-align:center}
.loading{color:#666;font-style:italic;padding:40px}
.error{color:#f66;padding:20px;text-align:center}
</style>
</head>
<body>

<h1>EL DESCENSO</h1>
<p class="sub">Ranking Global de los Condenados</p>
<a href="index.html" class="back">← VOLVER AL INFIERNO</a>

<div id="ranking">
  <div class="loading">Cargando almas...</div>
</div>

<div id="pagination">
  <button id="prevBtn" disabled>← ANTERIOR</button>
  <span id="pageInfo">Página 1</span>
  <button id="nextBtn">SIGUIENTE →</button>
</div>

<script>
const SUPABASE_URL='https://segmiclguvbhziwsafxw.supabase.co';
const SUPABASE_KEY='sb_publishable_LB778EdNYTWRb_mnqeiinw_R-wr12v9';
const PAGE_SIZE=20;
let currentPage=0;
let totalCount=0;

function fmt(ms){
  const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;
  return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadRanking(){
  const rankingEl=document.getElementById('ranking');
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  const pageInfo=document.getElementById('pageInfo');
  
  rankingEl.innerHTML='<div class="loading">Cargando almas...</div>';
  
  try{
    // Obtener total
    const countRes=await fetch(SUPABASE_URL+'/rest/v1/ranking?select=count',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'count=exact'}
    });
    const countHeader=countRes.headers.get('content-range');
    if(countHeader){
      totalCount=parseInt(countHeader.split('/')[1]||'0');
    }
    
    // Obtener página
    const from=currentPage*PAGE_SIZE;
    const to=from+PAGE_SIZE-1;
    const res=await fetch(SUPABASE_URL+'/rest/v1/ranking?select=name,time_ms,created_at&order=time_ms.asc&offset='+from+'&limit='+PAGE_SIZE,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    
    if(data.length===0){
      rankingEl.innerHTML='<div class="loading">Aún no hay almas condenadas...</div>';
      nextBtn.disabled=true;
      return;
    }
    
    let html='';
    data.forEach((r,i)=>{
      const num=from+i+1;
      html+='<div class="rank-row">';
      html+='<span class="rank-num">'+num+'.</span>';
      html+='<span class="rank-name">'+escapeHtml(r.name)+'</span>';
      html+='<span class="rank-time">'+fmt(r.time_ms)+'</span>';
      html+='</div>';
    });
    rankingEl.innerHTML=html;
    
    // Actualizar paginación
    prevBtn.disabled=currentPage===0;
    nextBtn.disabled=data.length<PAGE_SIZE;
    pageInfo.textContent='Página '+(currentPage+1);
    
  }catch(e){
    console.error('Error:',e);
    rankingEl.innerHTML='<div class="error">Error al cargar el ranking.<br>Los condenados no responden...</div>';
  }
}

document.getElementById('prevBtn').onclick=()=>{
  if(currentPage>0){
    currentPage--;
    loadRanking();
  }
};

document.getElementById('nextBtn').onclick=()=>{
  currentPage++;
  loadRanking();
};

loadRanking();
</script>

</body>
</html>
